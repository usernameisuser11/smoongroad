    <path d="M357 260c5 48-16 77-56 100l-97 56" fill="none" stroke="#fff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="342" r="25" fill="#62a9ff"/>
    <circle cx="366" cy="189" r="27" fill="#5cdb9a"/>
    <circle cx="130" cy="342" r="38" fill="#62a9ff" opacity=".18" filter="url(#soft)"/>
