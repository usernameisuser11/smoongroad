<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SMU.Link app icon</title>
  <desc id="desc">Blue rounded square with a larger white connected symbol, accent dots, and a slightly larger SMU.Link wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="450" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#114fd6"/>
      <stop offset="0.48" stop-color="#0738b8"/>
      <stop offset="1" stop-color="#071b70"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(306 229) rotate(140) scale(210 165)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f6fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f6fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
