<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#149E69" />
  <meta name="description" content="말모아 AAC 사용자 기기 연결" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="말모아 AAC" />
  <title>말모아 기기 연결</title>
  <link id="manifest-link" rel="manifest" href="/user.webmanifest" />
  <link rel="icon" href="/icons/user-192.png" />
  <link rel="apple-touch-icon" href="/icons/user-192.png" />
  <link rel="stylesheet" href="/pairing.css" />
</head>
<body class="connect-body">
  <main class="connect-page">
    <section class="connect-card">
      <div class="connect-brand">Mal<b>Moa</b></div>
      <span class="connect-kicker">기기 연결</span>
      <h1>보호자와 말모아 연결</h1>
      <p>보호자 화면의 QR을 스캔했거나 전달받은 6자리 코드를 입력해 주세요.</p>
      <form id="connect-form">
        <input class="connect-code" id="pair-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="6자리 연결 코드" />
        <div id="connect-status" class="connect-status" aria-live="polite"></div>
        <div class="connect-actions">
          <button id="connect-submit" type="submit">연결하기</button>
          <a href="/user">나중에 하기</a>
        </div>
      </form>
      <small class="connect-note">연결 후 보호자가 변경한 AAC 설정과 사용 기록이 같은 사용자 프로필로 동기화됩니다.</small>
    </section>
  </main>
  <script type="module" src="/connect.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
