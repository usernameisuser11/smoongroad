<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#149E69" />
  <meta name="description" content="말모아 AAC 사용자 기기 연결" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="말모아 AAC" />
  <title>말모아 기기 연결</title>
  <link id="manifest-link" rel="manifest" href="/user.webmanifest" />
  <link rel="icon" href="/icons/user-192.png" />
  <link rel="apple-touch-icon" href="/icons/user-192.png" />
  <link rel="stylesheet" href="/pairing.css" />
</head>
<body class="connect-body">
  <main class="connect-page">
    <section class="connect-card">
      <div class="connect-brand">Mal<b>Moa</b></div>
      <button class="connect-back" type="button" onclick="location.href='/user'" aria-label="뒤로">‹</button>
      <div id="code-view">
        <span class="connect-kicker">사용자 연결</span>
        <h1>초대 코드 입력</h1>
        <p>보호자가 알려준 6자리 초대 코드를 입력해 주세요.</p>
        <form id="connect-form">
          <div class="connect-digits" id="connect-digits" aria-label="6자리 연결 코드">
            <input class="connect-digit" data-digit="0" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="초대 코드 첫 번째 자리" />
            <input class="connect-digit" data-digit="1" inputmode="numeric" maxlength="1" aria-label="초대 코드 두 번째 자리" />
            <input class="connect-digit" data-digit="2" inputmode="numeric" maxlength="1" aria-label="초대 코드 세 번째 자리" />
            <input class="connect-digit" data-digit="3" inputmode="numeric" maxlength="1" aria-label="초대 코드 네 번째 자리" />
            <input class="connect-digit" data-digit="4" inputmode="numeric" maxlength="1" aria-label="초대 코드 다섯 번째 자리" />
            <input class="connect-digit" data-digit="5" inputmode="numeric" maxlength="1" aria-label="초대 코드 여섯 번째 자리" />
          </div>
          <div id="connect-status" class="connect-status" aria-live="polite"></div>
          <div class="connect-actions">
            <button id="connect-submit" type="submit">연결하기</button>
            <button class="connect-alt" id="open-qr" type="button">QR로 스캔하기</button>
          </div>
        </form>
      </div>
      <div id="qr-view" hidden>
        <span class="connect-kicker">사용자 연결</span>
        <h1>QR 스캔</h1>
        <p>보호자 화면의 QR 코드를 카메라 안에 맞춰 주세요.</p>
        <div class="qr-camera-wrap">
          <video id="qr-video" playsinline muted></video>
          <div class="qr-frame"><i></i><i></i><i></i><i></i></div>
          <div id="qr-message">카메라를 준비하고 있어요...</div>
        </div>
        <div class="connect-actions">
          <button class="connect-alt" id="qr-to-code" type="button">초대 코드 직접 입력</button>
        </div>
      </div>
      <small class="connect-note">연결이 완료되면 보호자가 설정한 AAC 화면이 자동으로 동기화돼요.</small>
    </section>
  </main>
  <script type="module" src="/connect.js"></script>
  <script type="module" src="/pwa.js"></script>
</body>
</html>
