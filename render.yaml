services:
  - type: web
    name: smoongroad
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.7-flash
      - key: AI_PRIMARY_RETRIES
        value: 1
      - key: AI_RETRY_BASE_MS
        value: 700
      - key: GEMINI_ATTEMPT_TIMEOUT_MS
        value: 8000
      - key: AI_TIMEOUT_MS
        value: 30000
